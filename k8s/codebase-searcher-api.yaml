# Internal-only — no NodePort/Ingress. This is a tool Hermes calls
# in-cluster, never something a browser or phone talks to directly, so
# there's no reason to expose it beyond the cluster network at all.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: codebase-searcher-data-pv
spec:
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/storage/codebase-searcher-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codebase-searcher-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codebase-searcher-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codebase-searcher-api
  template:
    metadata:
      labels:
        app: codebase-searcher-api
    spec:
      containers:
      - name: codebase-searcher-api
        image: codebase-searcher:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: DATA_DIR
          value: "/data"
        - name: GITHUB_USER
          value: "garyanewsome"
        - name: GITHUB_SSH_KEY_PATH
          value: "/secrets/github/id_ed25519_github"
        - name: VAULT_SSH_KEY_PATH
          value: "/secrets/vault-write/vault_write"
        - name: VAULT_REPO_URL
          value: "git@github.com:garyanewsome/obsidian-vault.git"
        - name: VAULT_FINDINGS_FOLDER
          value: "10 Development/Codebase Findings"
        volumeMounts:
        - name: codebase-searcher-data
          mountPath: /data
        - name: github-ssh-key
          mountPath: /secrets/github
          readOnly: true
        - name: vault-write-key
          mountPath: /secrets/vault-write
          readOnly: true
        # Same lesson as Hermes's own incident (see its README's
        # Reliability section): without these, a restart can route
        # traffic before init is done, and a wedged pod never gets
        # auto-restarted. Cheap to add from day one instead of after
        # hitting the problem live.
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
      volumes:
      - name: codebase-searcher-data
        persistentVolumeClaim:
          claimName: codebase-searcher-data
      - name: github-ssh-key
        secret:
          secretName: github-ssh-key
          defaultMode: 0400
      - name: vault-write-key
        secret:
          secretName: vault-write-key
          defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: codebase-searcher-api
spec:
  selector:
    app: codebase-searcher-api
  ports:
  - port: 8000
    targetPort: 8000
